services:
    db:
        image: 'mariadb:13.0'
        container_name: mariadb
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MARIADB_ROOT_PASSWORD: '${DB_PASSWORD}'
            MARIADB_ROOT_HOST: '%'
            MARIADB_DATABASE: '${DB_DATABASE}'
            MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
            # Runs mariadb-upgrade when the data dir was written by an older major,
            # and creates the healthcheck user on volumes that predate it.
            MARIADB_AUTO_UPGRADE: '1'
        volumes:
            - 'mariadb-eshop:/var/lib/mysql'
            - ./docker/dumps:/tmp/dumps
        networks:
            - command-center
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            retries: 10
            timeout: 5s

    phpmyadmin:
        image: 'phpmyadmin:5.2.3'
        ports:
            - '127.0.0.1:${PHPMYADMIN_PORT:-8081}:80'
        environment:
            PMA_PASSWORD: '${DB_PASSWORD}'
            PMA_BLOWFISH_SECRET: '${PMA_BLOWFISH_SECRET:-}'
        volumes:
            - './docker/phpmyadmin/config.inc.php:/etc/phpmyadmin/config.inc.php'
        depends_on:
            db:
                condition: service_healthy
        networks:
            - command-center

    redis:
        image: 'redis:8.10-alpine'
        container_name: redis
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis-eshop:/data'
        networks:
            - command-center
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s

    redisinsight:
        image: 'redis/redisinsight:3.8'
        container_name: redisinsight
        volumes:
            - 'redisinsight-eshop:/data'
        ports:
            - '127.0.0.1:${FORWARD_REDIS_INSIGHT_PORT:-8003}:5540'
        networks:
            - command-center

    setup:
        image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-9.5.3}
        volumes:
            - ./docker/elasticsearch/certs:/usr/share/elasticsearch/config/certs
        user: '0'
        networks:
            - command-center
        command: >
            bash -c '
              if [ x${ELASTIC_PASSWORD} == x ]; then
                echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
                exit 1;
              elif [ x${KIBANA_PASSWORD} == x ]; then
                echo "Set the KIBANA_PASSWORD environment variable in the .env file";
                exit 1;
              fi;

              if [ ! -f config/certs/ca.zip ]; then
                echo "Creating CA";
                bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
                unzip config/certs/ca.zip -d config/certs;
              fi;
              if [ ! -f config/certs/certs.zip ]; then
                echo "Creating certs";
                echo -ne \
                "instances:\n"\
                "  - name: elasticsearch\n"\
                "    dns:\n"\
                "      - elasticsearch\n"\
                "      - localhost\n"\
                "    ip:\n"\
                "      - 127.0.0.1\n"\
                > config/certs/instances.yml;
                bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
                unzip config/certs/certs.zip -d config/certs;
              fi;

              echo "Certs ready";
            '

    kibana-password:
        depends_on:
            elasticsearch:
                condition: service_healthy
        image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-9.5.3}
        volumes:
            - ./docker/elasticsearch/certs:/usr/share/elasticsearch/config/certs:ro
        networks:
            - command-center
        command: >
            bash -c '
              echo "Setting kibana_system password";
              until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://elasticsearch:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 5; done;
              echo "All done!";
            '

    copy-elastic-certs:
        depends_on:
            setup:
                condition: service_completed_successfully
        image: 'alpine:3.22'
        container_name: elasticsearch-certificates
        volumes:
            - ./docker/elasticsearch/certs:/tmp/certs:ro
            - ./storage/app/private/elastic:/tmp/storage
        networks:
            - command-center
        command: cp /tmp/certs/ca/ca.crt /tmp/storage/ca.crt

    elasticsearch:
        depends_on:
            setup:
                condition: service_completed_successfully
        image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-9.5.3}
        container_name: elasticsearch
        environment:
            - node.name=elasticsearch
            - discovery.type=single-node
            - bootstrap.memory_lock=true
            - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
            - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
            - xpack.license.self_generated.type=trial
            - xpack.security.enabled=true
            - xpack.security.http.ssl.enabled=true
            - xpack.security.http.ssl.key=${CERTS_DIR}/elasticsearch/elasticsearch.key
            - xpack.security.http.ssl.certificate_authorities=${CERTS_DIR}/ca/ca.crt
            - xpack.security.http.ssl.certificate=${CERTS_DIR}/elasticsearch/elasticsearch.crt
            - xpack.security.transport.ssl.enabled=true
            - xpack.security.transport.ssl.verification_mode=certificate
            - xpack.security.transport.ssl.certificate_authorities=${CERTS_DIR}/ca/ca.crt
            - xpack.security.transport.ssl.certificate=${CERTS_DIR}/elasticsearch/elasticsearch.crt
            - xpack.security.transport.ssl.key=${CERTS_DIR}/elasticsearch/elasticsearch.key
        ulimits:
            memlock:
                soft: -1
                hard: -1
        volumes:
            - elasticsearch-eshop-data:/usr/share/elasticsearch/data
            - ./docker/elasticsearch/certs:${CERTS_DIR}
            - ./docker/elasticsearch/hunspell:/usr/share/elasticsearch/config/hunspell/
            - ./storage/app/private/elastic:/usr/share/elasticsearch/config/wordfiles/
        ports:
            - '127.0.0.1:9200:9200'
        networks:
            - command-center
        healthcheck:
            test: ['CMD-SHELL', 'curl -s --cacert ${CERTS_DIR}/ca/ca.crt https://localhost:9200 | grep -q "missing authentication credentials"']
            interval: 10s
            timeout: 5s
            retries: 30

    kibana:
        depends_on:
            kibana-password:
                condition: service_completed_successfully
        image: docker.elastic.co/kibana/kibana:${ES_VERSION:-9.5.3}
        container_name: kibana
        ports:
            - '127.0.0.1:5601:5601'
        environment:
            - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
            - ELASTICSEARCH_USERNAME=kibana_system
            - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
            - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/certs/ca/ca.crt
        volumes:
            - ./docker/elasticsearch/certs:/usr/share/kibana/config/certs
        networks:
            - command-center

    selenium:
        image: 'selenium/standalone-chromium:4.49'
        shm_size: 2gb
        ports:
            - '127.0.0.1:4444:4444' # WebDriver + Grid UI
            - '127.0.0.1:7900:7900' # noVNC viewer (password: secret)
        networks:
            - command-center

networks:
    command-center:
        name: command-center
        driver: bridge
volumes:
    elasticsearch-eshop-data:
        driver: local
    mariadb-eshop:
        driver: local
    redis-eshop:
        driver: local
    redisinsight-eshop:
        driver: local
